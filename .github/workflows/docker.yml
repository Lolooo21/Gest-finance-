name: Images Docker
on:
  pull_request:
    paths: ["infra/**", "apps/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/docker.yml"]
  push:
    branches: [main, develop, "claude/**"]
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Installer age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Secrets de test (script de production en mode CI)
        run: sh infra/scripts/init-secrets.sh --ci
      - name: Construire les images
        run: docker compose -f infra/docker/compose.prod.yml -f infra/docker/compose.ci.yml build
      - name: Démarrer la pile (sans Tailscale)
        run: docker compose -f infra/docker/compose.prod.yml -f infra/docker/compose.ci.yml up -d
      - name: Test de fumée
        run: sh infra/scripts/smoke.sh
      - name: État des conteneurs
        if: always()
        run: docker compose -f infra/docker/compose.prod.yml -f infra/docker/compose.ci.yml ps -a
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose -f infra/docker/compose.prod.yml -f infra/docker/compose.ci.yml logs --no-color --tail=120
      - name: Sauvegarde chiffrée puis restauration (conteneur de production)
        run: |
          set -e
          C="docker compose -f infra/docker/compose.prod.yml -f infra/docker/compose.ci.yml"
          $C exec -T backup backup.sh
          $C exec -T backup sh -c 'ls /backups && cat /backups/last-success.txt'
          F="$($C exec -T backup sh -c 'ls /backups/gest-*.dump.age | head -n1' | tr -d '\r')"
          # La clé privée de test n'a jamais été sur le serveur : on déchiffre ici avec une clé qui ne correspond pas -> échec attendu.
          age-keygen -o /tmp/mauvaise.txt 2>/dev/null
          $C cp "backup:$F" /tmp/test.dump.age
          if age -d -i /tmp/mauvaise.txt -o /tmp/out.dump /tmp/test.dump.age 2>/dev/null; then echo "ÉCHEC : déchiffrement avec une mauvaise clé"; exit 1; fi
          echo "OK : sauvegarde chiffrée, illisible sans la clé privée."
      - name: Scan Trivy des images (gravité haute ou critique, correctifs disponibles)
        run: |
          for image in ghcr.io/lolooo21/gest-finance-api:local ghcr.io/lolooo21/gest-finance-proxy:local ghcr.io/lolooo21/gest-finance-backup:local; do
            echo "== $image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - name: Mise à jour automatique du VPS (succès, puis échec avec retour arrière et restauration)
        run: |
          set -eu
          C="docker compose -f infra/docker/compose.prod.yml -f infra/docker/compose.ci.yml"
          R=ghcr.io/lolooo21/gest-finance
          for n in api proxy backup; do docker tag "$R-$n:local" "$R-$n:0.0.1"; docker tag "$R-$n:local" "$R-$n:0.0.2"; docker tag "$R-$n:local" "$R-$n:0.0.3"; done
          # 0.0.3 : API qui ne démarre pas (les migrations, elles, passent) → le contrôle de santé doit échouer.
          printf 'FROM %s\nCMD ["node", "-e", "process.exit(1)"]\n' "$R-api:local" | docker build -q -t "$R-api:0.0.3" - > /dev/null
          sed -i 's/^GEST_VERSION=.*/GEST_VERSION=0.0.1/' infra/docker/.env
          $C up -d --wait
          export COMPOSE="$C" AUTO_UPDATE_SKIP_GIT=1 AUTO_UPDATE_SKIP_VERIFY=1 AUTO_UPDATE_SKIP_PULL=1 HEALTH_TIMEOUT=180
          AUTO_UPDATE_TARGET=0.0.2 sh infra/deploy/auto-update.sh
          grep -qx 'GEST_VERSION=0.0.2' infra/docker/.env || { echo "ÉCHEC : version 0.0.2 non enregistrée"; exit 1; }
          # Nettoyage : la version installée (0.0.2) et la précédente (0.0.1) sont gardées, la 0.0.3 aussi (pas encore installée).
          for n in api proxy backup; do docker image inspect "$R-$n:0.0.1" "$R-$n:0.0.2" "$R-$n:0.0.3" > /dev/null || { echo "ÉCHEC : image $n supprimée à tort"; exit 1; }; done
          foyers="$($C exec -T postgres psql -U gest -d gest_finance -tAc 'SELECT count(*) FROM "Household"')"
          code=0; AUTO_UPDATE_TARGET=0.0.3 AUTO_UPDATE_FORCE_RESTORE=1 sh infra/deploy/auto-update.sh || code=$?
          [ "$code" = "1" ] || { echo "ÉCHEC : code $code attendu 1 (retour arrière réussi)"; exit 1; }
          grep -qx 'GEST_VERSION=0.0.2' infra/docker/.env || { echo "ÉCHEC : pas revenu à 0.0.2"; exit 1; }
          curl -fsS -m 5 http://127.0.0.1:8080/health > /dev/null || { echo "ÉCHEC : application injoignable après le retour arrière"; exit 1; }
          apres="$($C exec -T postgres psql -U gest -d gest_finance -tAc 'SELECT count(*) FROM "Household"')"
          [ "$foyers" = "$apres" ] && [ "$apres" -ge 1 ] || { echo "ÉCHEC : données perdues ($foyers → $apres foyers)"; exit 1; }
          # Mise à jour suivante (0.0.4, saine) : la 0.0.1, ni installée ni précédente, est supprimée ; 0.0.2 (précédente) gardée.
          for n in api proxy backup; do docker tag "$R-$n:local" "$R-$n:0.0.4"; done
          AUTO_UPDATE_TARGET=0.0.4 sh infra/deploy/auto-update.sh
          for n in api proxy backup; do
            docker image inspect "$R-$n:0.0.1" > /dev/null 2>&1 && { echo "ÉCHEC : ancienne image $n:0.0.1 non supprimée"; exit 1; }
            docker image inspect "$R-$n:0.0.2" "$R-$n:0.0.4" > /dev/null || { echo "ÉCHEC : image $n utile supprimée"; exit 1; }
          done
          echo "OK : mise à jour 0.0.1 → 0.0.2, puis 0.0.3 refusée au contrôle de santé, retour à 0.0.2 avec base restaurée ($apres foyer(s)), puis 0.0.4 installée et ancienne 0.0.1 supprimée."
      - name: Arrêt
        if: always()
        run: docker compose -f infra/docker/compose.prod.yml -f infra/docker/compose.ci.yml down -v
