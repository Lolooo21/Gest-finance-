name: CI
on:
  pull_request:
  push:
    branches: [main, "claude/**"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gest
          POSTGRES_PASSWORD: gest_ci
          POSTGRES_DB: gest_finance
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gest" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://gest:gest_ci@localhost:5432/gest_finance
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gest-finance/api exec prisma generate
      - run: pnpm --filter @gest-finance/api exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @gest-finance/web build
      - name: Dépendances de production vulnérables (gravité haute ou critique)
        run: pnpm audit --prod --audit-level high
      - name: Sauvegarde, chiffrement et restauration (vrai PostgreSQL)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age postgresql-client
          PGHOST=localhost PGUSER=gest PGPASSWORD=gest_ci PGDATABASE=gest_finance sh infra/backup/test-backup.sh
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
